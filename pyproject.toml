[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creep-rag-service"
version = "0.1.0"
description = "RAG over Ni-superalloy creep test records, alloy data sheets and study notes: hybrid search, metadata filter, abstention gate, citation checks, evaluation harness"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Zaif Mohammed"}]
dependencies = [
  "numpy>=1.26", "scikit-learn>=1.4", "rank-bm25==0.2.2", "faiss-cpu>=1.8", "qdrant-client>=1.12",
  "wordllama==0.4.0.post1", "fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6",
  "httpx>=0.27", "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
baselines = ["spacy>=3.7"]
st = ["sentence-transformers>=3"]

[tool.setuptools]
packages = ["rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
